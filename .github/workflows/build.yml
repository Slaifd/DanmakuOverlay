
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o DanmakuOverlay-source.zip -d /tmp/danmaku-source

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/danmaku-source/DanmakuOverlay/app/build.gradle.kts")
          s = p.read_text()
          if "compileOptions" not in s:
              s = s.rstrip()
              if not s.endswith("}"):
                  raise SystemExit("Could not find the end of build.gradle.kts")
              s = s[:-1] + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
              p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: /tmp/danmaku-source/DanmakuOverlay
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DanmakuOverlay-debug-apk
          path: /tmp/danmaku-source/DanmakuOverlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
